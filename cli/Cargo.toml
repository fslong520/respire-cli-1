[package]
name = "respire"
version = "1.0.16"
edition = "2021"
rust-version = "1.88"
description = "respire CLI — encrypted cross-device AI memory"
license-file = "../LICENSE"
repository = "https://github.com/risense-ai/respire-cli"

[features]
default = ["cpu-owned-ort-experiment"]
native-fault-tests = ["respire_app/native-fault-tests"]
cpu-owned-ort-experiment = ["respire_app/cpu-owned-ort-experiment"]

[[bin]]
name = "rsrs"
path = "src/main.rs"

[dependencies]
respire_app = { package = "respire_app", path = "../crates/app", default-features = false }
respire_spawn = { path = "../spawn" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "=0.2.0"
ureq = { version = "2.12", features = ["json", "socks-proxy"] }
url = "2.5"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "v5"] }
# Interactive terminal selector for inject --tui
ratatui = "0.29"
crossterm = "0.28"
# Authenticated local HTTP RPC/MCP transport
tiny_http = "0.12"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
# Shared subtree payloads: gzip compression and base64 for text transport
flate2 = "1.1"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3.15"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
