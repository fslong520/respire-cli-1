[package]
name = "respire_storage"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license-file = "../../LICENSE"
description = "SQLite persistence, compatible schema, revisions and sync bookkeeping"
publish = false

[dependencies]
respire_protocol = { path = "../protocol" }
respire_crypto = { path = "../crypto" }
respire_core_sdk = { path = "../core-sdk" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.15"

[lints.rust]
unsafe_code = "forbid"
