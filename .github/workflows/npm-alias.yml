name: Publish short npm entry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected published version (empty uses the Release receipt)'
        type: string
        default: ''
      release_run:
        description: 'Release run whose publication job succeeded; regressions may still be running'
        type: string
        required: true
        default: ''
      release_attempt:
        description: 'Exact active Release attempt; provided only after its scoped receipt is uploaded'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Release dispatches this only after uploading the exact scoped receipt.
  await-scoped:
    if: inputs.release_attempt != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.ready.outputs.eligible }}
      sha: ${{ steps.ready.outputs.sha }}
      protocol: ${{ steps.ready.outputs.protocol }}
      artifact: ${{ steps.ready.outputs.artifact }}
      file: ${{ steps.ready.outputs.file }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Validate recovery tooling using trusted main before the OIDC checkout.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Read this Release attempt scoped publication receipt once
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.release_run }}
          SOURCE_ATTEMPT: ${{ inputs.release_attempt }}
        run: node npm/scripts/release-publication.mjs await-scoped

  publish-integrated:
    needs: await-scoped
    if: needs.await-scoped.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    # Legacy protocol retains its propagation/install budget. Protocol 2 only
    # submits npm here; independent read-only verification holds no write lock.
    timeout-minutes: 75
    concurrency:
      group: npm-rsrs-cli-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The release input ref may differ from workflow_run.head_sha/main.
          ref: ${{ needs.await-scoped.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.await-scoped.outputs.artifact }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - run: node npm/scripts/test-wrapper.mjs
      - name: Publish the matching short entry (legacy also verifies installation)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.release_run }}
          SOURCE_ATTEMPT: ${{ inputs.release_attempt }}
        run: node npm/scripts/release-publication.mjs ${{ needs.await-scoped.outputs.protocol == '2' && 'publish-alias-accepted' || 'publish-alias' }}
      - uses: actions/upload-artifact@v4
        if: always() && needs.await-scoped.outputs.protocol == '2'
        with:
          retention-days: 1
          name: alias-submissions-${{ inputs.release_run }}-${{ inputs.release_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: alias-submissions.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: ${{ needs.await-scoped.outputs.protocol == '2' && 'alias-accepted' || 'alias-ready' }}-${{ inputs.release_run }}-${{ inputs.release_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ needs.await-scoped.outputs.protocol == '2' && 'alias-accepted.json' || 'alias-ready.json' }}
          if-no-files-found: error

  # Explicit recovery for already-public historical releases only. Automatic
  # releases use the draft-aware barrier above, never this completed-run path.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_attempt == ''
    concurrency:
      group: npm-rsrs-cli-publication
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Resolve the published Release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.release_run }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync, mkdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const api = endpoint => JSON.parse(execFileSync('gh', ['api', endpoint], { encoding: 'utf8' }));
          async function waitForScopedCli(version) {
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await fetch(`https://registry.npmjs.org/@rsrsai%2fcli/${version}`, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(Math.min(30000, deadline - Date.now())),
              });
              if (response.status !== 404) {
                if (!response.ok) throw new Error(`Scoped CLI is not public: HTTP ${response.status}`);
                return response.json();
              }
              await response.body?.cancel();
              const delay = Math.min(15000, deadline - Date.now());
              if (delay <= 0) break;
              console.log('Waiting for the matching scoped CLI to propagate in the public npm registry');
              await new Promise(resolve => setTimeout(resolve, delay));
            }
            throw new Error('Matching scoped CLI did not become public within five minutes');
          }
          const repo = process.env.GITHUB_REPOSITORY;
          const sourceRun = process.env.SOURCE_RUN;
          let version = process.env.REQUESTED_VERSION;
          if (!sourceRun) throw new Error('A Release run with successful publication is required');
          if (sourceRun) {
            if (!/^\d+$/.test(sourceRun)) throw new Error('Invalid Release run ID');
            const run = api(`repos/${repo}/actions/runs/${sourceRun}`);
            if (run.name !== 'Release' || run.head_repository?.full_name !== repo ||
                (process.env.GITHUB_EVENT_NAME === 'workflow_run' && run.status !== 'completed')) {
              throw new Error('Expected a Release run from this repository; automatic runs must be completed');
            }
            const jobs = JSON.parse(execFileSync('gh', ['api','--paginate','--slurp',`repos/${repo}/actions/runs/${sourceRun}/jobs?per_page=10`], {encoding:'utf8'})).flatMap(page=>page.jobs);
            if (!['plan', 'publish'].every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) {
              if (process.env.GITHUB_EVENT_NAME !== 'workflow_run') throw new Error('Release publication did not succeed');
              appendFileSync(process.env.GITHUB_OUTPUT, 'eligible=false\n');
              console.log('No successful Release publication; skipping primary npm entry');
              process.exit(0);
            }
            const receipts = path.join(process.env.RUNNER_TEMP, 'release-npm-receipts');
            mkdirSync(receipts, { recursive: true });
            execFileSync('gh', ['run', 'download', sourceRun, '--repo', repo, '--name', 'npm-release-validation', '--dir', receipts], { stdio: 'inherit' });
            const rawPacks = JSON.parse(readFileSync(path.join(receipts, '@rsrsai/cli/release.pack.json'), 'utf8'));
            const packs = Array.isArray(rawPacks) ? rawPacks : Object.values(rawPacks);
            if (packs.length !== 1 || packs[0].name !== '@rsrsai/cli' || !packs[0].integrity || !packs[0].shasum) throw new Error('Invalid scoped CLI receipt');
            if (version && version !== packs[0].version) throw new Error('Requested version differs from the Release receipt');
            version = packs[0].version;
            const published = await waitForScopedCli(version);
            if (published.dist.integrity !== packs[0].integrity || published.dist.shasum !== packs[0].shasum) {
              throw new Error('Public scoped CLI differs from the Release receipt');
            }
            const release = api(`repos/${repo}/releases/tags/v${version}`);
            if (release.draft) throw new Error('Release is still a draft');
          }
          if (!version || !/^\d+\.\d+\.\d+(?:-dev\.\d+)?$/.test(version)) throw new Error('Expected a stable or DEV version');
          const tag = version.includes('-dev.') ? 'dev' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `eligible=true\nversion=${version}\ntag=${tag}\n`);
          console.log(`Primary npm entry: rsrs-cli@${version}, tag=${tag}`);
          NODE
      - run: npm install -g npm@12.2.0
        if: steps.release.outputs.eligible == 'true'
      - run: node npm/scripts/test-wrapper.mjs
        if: steps.release.outputs.eligible == 'true'
      - run: node npm/scripts/pack-alias.mjs --version "$ALIAS_VERSION"
        if: steps.release.outputs.eligible == 'true'
        env:
          ALIAS_VERSION: ${{ steps.release.outputs.version }}
      - name: Require the matching public CLI dependency
        if: steps.release.outputs.eligible == 'true'
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('npm/dist/rsrs-cli/package.json', 'utf8'));
          if (pkg.name !== 'rsrs-cli' || !/^\d+\.\d+\.\d+(?:-dev\.\d+)?$/.test(pkg.version) ||
              pkg.dependencies['@rsrsai/cli'] !== pkg.version) throw new Error('Expected a matching CLI version');
          const published = JSON.parse(execFileSync('npm', ['view', `@rsrsai/cli@${pkg.version}`, 'version', '--json'], { encoding: 'utf8' }));
          const versions = Array.isArray(published) ? published : [published];
          if (versions.length !== 1 || versions[0] !== pkg.version) throw new Error('Matching scoped CLI is not publicly available');
          NODE
      - name: Publish using the rsrs-cli package trusted publisher
        if: steps.release.outputs.eligible == 'true'
        env:
          ALIAS_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('npm/dist/rsrs-cli/package.json', 'utf8'));
          const rawPacked = JSON.parse(execFileSync('npm', ['pack', './npm/dist/rsrs-cli', '--json', '--pack-destination', process.env.RUNNER_TEMP], { encoding: 'utf8' }));
          const packed = Array.isArray(rawPacked) ? rawPacked : Object.values(rawPacked);
          if (packed.length !== 1 || packed[0].name !== pkg.name || packed[0].version !== pkg.version || !packed[0].integrity || !packed[0].shasum) {
            throw new Error('Expected exactly one matching primary npm package receipt');
          }
          writeFileSync('alias.pack.json', JSON.stringify(packed, null, 2) + '\n');
          const response = await fetch(`https://registry.npmjs.org/rsrs-cli/${pkg.version}`);
          if (response.ok) {
            const published = await response.json();
            if (published.dependencies?.['@rsrsai/cli'] !== pkg.version || published.dist.integrity !== packed[0].integrity) {
              throw new Error('Existing primary entry differs from this package');
            }
            console.log(`rsrs-cli@${pkg.version} already published; leaving distribution tags unchanged`);
          } else if (response.status === 404) {
            const tagsResponse = await fetch('https://registry.npmjs.org/-/package/rsrs-cli/dist-tags');
            if (!tagsResponse.ok) throw new Error(`Cannot read primary entry tags: HTTP ${tagsResponse.status}`);
            const tags = await tagsResponse.json();
            const current = tags[process.env.ALIAS_TAG];
            if (current) {
              const numbers = value => {
                const match = /^(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?$/.exec(value);
                if (!match) throw new Error(`Unexpected distribution tag version: ${value}`);
                return match.slice(1).map(part => part === undefined ? null : BigInt(part));
              };
              const candidate = numbers(pkg.version), existing = numbers(current);
              for (let i = 0; i < candidate.length; i++) {
                if (candidate[i] === existing[i]) continue;
                if (existing[i] === null || (candidate[i] !== null && candidate[i] < existing[i])) {
                  throw new Error(`Refusing to move ${process.env.ALIAS_TAG} backward from ${current} to ${pkg.version}`);
                }
                break;
              }
            }
            execFileSync('npm', ['publish', './npm/dist/rsrs-cli', '--access', 'public', '--tag', process.env.ALIAS_TAG, '--provenance'], { stdio: 'inherit' });
          } else {
            throw new Error(`Cannot check existing primary entry: HTTP ${response.status}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          retention-days: 1
          name: rsrs-cli-package-receipt
          path: alias.pack.json
          if-no-files-found: error
