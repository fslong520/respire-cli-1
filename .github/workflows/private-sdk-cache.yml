name: Prepare reviewed private SDK dependencies
on:
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: Exact independently reviewed CLI commit containing both private SDK locks
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    cache-mode: none
    if: github.repository == 'risense-ai/respire-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Read source-controlled lock JSON as data only
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
        run: |
          set -euo pipefail
          [[ "$SDK_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          mkdir "$RUNNER_TEMP/sdk-locks"
          gh api "repos/risense-ai/respire-cli/contents/sdk/core-sdk.lock.json?ref=$SDK_SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/sdk-locks/root.json"
          gh api "repos/risense-ai/respire-cli/contents/crates/core-sdk/core-sdk.lock.json?ref=$SDK_SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/sdk-locks/crate.json"
          node scripts/sdk-ci-cache.mjs plan "$RUNNER_TEMP/sdk-locks/root.json" "$RUNNER_TEMP/sdk-locks/crate.json" > "$RUNNER_TEMP/sdk-locks/plan.json"
          node --input-type=module - <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const matrix=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/sdk-locks/plan.json'));
          const os={'x86_64-unknown-linux-gnu':'ubuntu-latest','x86_64-unknown-linux-musl':'ubuntu-latest','aarch64-unknown-linux-gnu':'ubuntu-24.04-arm','aarch64-unknown-linux-musl':'ubuntu-24.04-arm','aarch64-apple-darwin':'macos-latest','x86_64-pc-windows-msvc':'windows-latest'};
          const native={include:matrix.include.filter(x=>os[x.target]).map(({target,key})=>({target,key,os:os[target]}))};
          if(native.include.length!==6)throw Error('Expected all six native SDK consumers');
          appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(matrix)}\nnative=${JSON.stringify(native)}\n`);
          JS
  download:
    cache-mode: write-only
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Credential-bearing code is always the workflow's reviewed main commit.
      # Never checkout/execute the selected source revision in this job.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare and audit exact SDK bytes using trusted main tools
        env:
          CORE_SDK_READ_TOKEN: ${{ secrets.CORE_SDK_READ_TOKEN }}
          SDK_TARGET: ${{ matrix.target }}
          SDK_ENTRY_JSON: ${{ toJSON(matrix.entry) }}
        run: node scripts/sdk-ci-cache.mjs prepare "$SDK_TARGET" "$SDK_ENTRY_JSON"
      - uses: actions/cache/save@v4
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ matrix.key }}
          enableCrossOsArchive: true
  native:
    cache-mode: read
    needs: [plan, download]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    # No secrets are passed/inherited into this separate reusable workflow.
    uses: ./.github/workflows/token-free-sdk-check.yml
    with:
      source_sha: ${{ inputs.reviewed_source_sha }}
      target: ${{ matrix.target }}
      cache_key: ${{ matrix.key }}
      runner_os: ${{ matrix.os }}
