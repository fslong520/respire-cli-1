name: Persist release compilation dependencies

on:
  workflow_run:
    workflows: [Release, Release validation]
    types: [completed]

cache-mode: none
permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.artifacts.outputs.matrix }}
      available: ${{ steps.artifacts.outputs.available }}
    steps:
      - name: Select only this successful trusted run's compilation archives
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          run_id=os.environ['SOURCE_RUN']
          if not re.fullmatch('[1-9][0-9]*',run_id): raise ValueError('Invalid source run')
          def api(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          run=api(f'repos/{repo}/actions/runs/{run_id}')
          if (run['conclusion']!='success' or run['event'] not in ['workflow_dispatch','push'] or run['head_branch']!='main' or
              run['head_repository']['full_name']!=repo or run['head_sha']!=os.environ['SOURCE_SHA'] or
              str(run['run_attempt'])!=os.environ['SOURCE_ATTEMPT'] or
              run['path'] not in ['.github/workflows/release.yml','.github/workflows/release-validation.yml']):
              raise ValueError('Untrusted or superseded compilation producer')
          targets={'x86_64-unknown-linux-gnu','x86_64-unknown-linux-musl','aarch64-unknown-linux-gnu','aarch64-unknown-linux-musl','aarch64-apple-darwin','x86_64-apple-darwin','x86_64-pc-windows-msvc','aarch64-pc-windows-msvc'}
          selected={}
          for page in range(1,101):
              artifacts=api(f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}')['artifacts']
              for artifact in artifacts:
                  if not artifact['name'].startswith('release-dependency-cache-'): continue
                  target=artifact['name'][len('release-dependency-cache-'):]
                  if target not in targets or target in selected or artifact['expired']:
                      raise ValueError('Invalid or duplicate compilation cache artifact')
                  selected[target]={'target':target,'artifact_id':artifact['id']}
              if len(artifacts)<100: break
          else: raise ValueError('Compilation artifact pagination limit exceeded')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps({'include':list(selected.values())})+'\n')
              output.write('available='+str(bool(selected)).lower()+'\n')
          PY

  save:
    needs: plan
    if: needs.plan.outputs.available == 'true'
    cache-mode: write-only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: incoming
          merge-multiple: true
      - name: Validate source identity and dependency-only archive paths
        id: cache
        env:
          CACHE_TARGET: ${{ matrix.target }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile
          target=os.environ['CACHE_TARGET']
          with tarfile.open('incoming/.rust-release-save.tar.gz') as archive:
              seen=set()
              for member in archive.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  if (path.is_absolute() or '..' in path.parts or member.issym() or member.islnk() or
                      not (member.isfile() or member.isdir()) or path in seen):
                      raise ValueError('Unsafe release dependency cache member')
                  seen.add(path)
                  parts=path.parts
                  if parts and parts[0] not in ['host','target','cargo','key','source.json']:
                      raise ValueError('Unexpected release dependency cache path')
                  if parts and parts[0] in ['host','target'] and len(parts)>1 and parts[1]!='release':
                      raise ValueError('Unexpected release compilation profile')
                  if parts and parts[0] in ['host','target'] and len(parts)>2 and parts[2] not in ['deps','build','.fingerprint']:
                      raise ValueError('Only compilation dependency directories may be cached')
                  if parts and parts[0]=='cargo' and len(parts)>1 and parts[1]!='cache':
                      raise ValueError('Cargo credentials/index are not cached')
              archive.extractall('.rust-release-cache',filter='data')
          root=pathlib.Path('.rust-release-cache')
          source=json.loads((root/'source.json').read_text())
          if source!={'target':target,'sha':os.environ['SOURCE_SHA'],'run_id':os.environ['SOURCE_RUN'],'run_attempt':os.environ['SOURCE_ATTEMPT']}:
              raise ValueError('Foreign compilation cache source or attempt')
          key=(root/'key').read_text().strip()
          if not re.fullmatch('rust-release-v1-'+re.escape(target)+'-[a-f0-9]{64}',key):
              raise ValueError('Invalid release dependency cache identity')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('key='+key+'\n')
          PY
      - uses: actions/cache/save@v4
        with:
          path: .rust-release-cache
          key: ${{ steps.cache.outputs.key }}
          enableCrossOsArchive: true
