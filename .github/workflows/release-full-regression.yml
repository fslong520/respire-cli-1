name: Daily full release regression

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  full-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Start a nonpublishing full run with its own complete evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run release.yml --repo "$REPOSITORY" --ref main \
            -f ref=main -f publish=false -f validation_profile=full \
            -f full_regression_before_publish=true
          echo 'The dispatched Release run reports full results and source-bound evidence; this dispatch is not a validation result.' >> "$GITHUB_STEP_SUMMARY"
