name: Clean consumed release artifacts

on:
  schedule:
    # Best effort: at least one hour AFTER the last consumer, then the next tick.
    # GitHub schedule delays prevent a strict wall-clock expiry guarantee.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only audit candidates; do not delete artifacts
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'risense-ai/respire-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This is the ONLY new permission. It is necessary for artifact DELETE and
    # must be reviewed before merging/activating this workflow; no new secret.
    permissions:
      contents: read
      actions: write
    # Same lock as BOTH existing alias publisher jobs. Parent Release completion
    # is separately required, so awaitAlias can never lose a child receipt.
    concurrency:
      group: npm-rsrs-cli-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Always execute reviewed default-branch policy, never artifact code
          # or a workflow_run's potentially different selected release ref.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Audit or clean only fully consumed opted-in release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_MODE: ${{ github.event_name == 'schedule' && '--apply' || inputs.dry_run && '--dry-run' || '--apply' }}
        run: node npm/scripts/cleanup-release-artifacts.mjs "$CLEANUP_MODE"
