name: Opt-in user runtime supervision validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-autostart-validation.yml'
      - 'scripts/test-runtime-autostart.py'
      - 'cli/src/autostart.rs'
      - 'cli/src/autostart/**'
      - 'cli/src/main.rs'
      - 'cli/src/rpc.rs'
      - 'cli/src/net_rpc.rs'
      - 'cli/src/runtime_http.rs'
      - 'cli/src/mcp.rs'
      - 'spawn/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  user-runtime:
    cache-mode: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: '', previous_package: '@rsrsai/linux-x64-gnu'}
          - {os: macos-latest, target: aarch64-apple-darwin, suffix: '', previous_package: '@rsrsai/macos-arm64'}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, suffix: '.exe', previous_package: '@rsrsai/win-x64'}
    env:
      RSRS_ENGINE: cpu
      RUST_TEST_THREADS: '1'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Require token-free validation
        shell: bash
        run: test -z "${CORE_SDK_READ_TOKEN:-}"
      - name: Resolve pinned SDK cache identity
        id: sdk
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          key=$(node scripts/sdk-ci-cache.mjs key "$SDK_TARGET")
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk-restore
        with:
          path: .sdk/${{ matrix.target }}
          key: ${{ steps.sdk.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Require exact verified SDK bytes
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXPECTED_KEY: ${{ steps.sdk.outputs.key }}
          MATCHED_KEY: ${{ steps.sdk-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_KEY" && test "$MATCHED_KEY" = "$EXPECTED_KEY"
          node scripts/fetch-core-sdk.mjs "$SDK_TARGET"
      - name: Build and test exact native source
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          RSRS_CORE_TEST_MODE: '1'
        run: |
          set -euo pipefail
          if [[ "$SDK_TARGET" == *windows-msvc ]]; then export RUSTFLAGS='-C target-feature=-crt-static'; fi
          cargo test --locked -p respire_spawn --target "$SDK_TARGET" --target-dir target/autostart-validation
          cargo test --locked -p respire --bin rsrs autostart:: --target "$SDK_TARGET" --target-dir target/autostart-validation -- --test-threads=1 --show-output
          cargo build --locked -p respire --bin rsrs --target "$SDK_TARGET" --target-dir target/autostart-validation
      - name: Fetch immutable previous public native version without install scripts
        shell: bash
        env:
          PREVIOUS_PACKAGE: ${{ matrix.previous_package }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/autostart-user.npmrc"
          : > "$RUNNER_TEMP/autostart-global.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/autostart-user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/autostart-global.npmrc"
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm install --prefix "$RUNNER_TEMP/autostart-previous" --ignore-scripts --no-bin-links --no-audit --no-fund --registry https://registry.npmjs.org "$PREVIOUS_PACKAGE@1.0.17-dev.6"
          node -e 'const fs=require("fs"),p=require("path");const lock=JSON.parse(fs.readFileSync(p.join(process.env.RUNNER_TEMP,"autostart-previous/package-lock.json")));const key="node_modules/"+process.env.PREVIOUS_PACKAGE;const x=lock.packages[key];if(x.version!=="1.0.17-dev.6"||!x.integrity.startsWith("sha512-"))throw Error("previous native integrity unavailable");console.log(JSON.stringify({name:process.env.PREVIOUS_PACKAGE,version:x.version,integrity:x.integrity}));'
      - name: Foreground and actual isolated current-user service lifecycle
        shell: bash
        env:
          SDK_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
          PREVIOUS_PACKAGE: ${{ matrix.previous_package }}
        run: |
          set -euo pipefail
          python scripts/test-runtime-autostart.py --binary "target/autostart-validation/$SDK_TARGET/debug/rsrs$EXE_SUFFIX" --register --previous-binary "$RUNNER_TEMP/autostart-previous/node_modules/$PREVIOUS_PACKAGE/bin/rsrs$EXE_SUFFIX"
