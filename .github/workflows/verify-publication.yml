name: Verify public npm publication

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run:
        description: Exact completed Release run (read-only verification of accepted publication)
        required: true
        type: string
      release_attempt:
        description: Exact completed Release attempt
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-publication:
    if: github.repository == 'risense-ai/respire-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    # No publication lock, OIDC, SDK credential or npm write permission. A
    # completed immutable source attempt is valid only for these read operations.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify public package bytes and isolated exact-version installation
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.release_run }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.release_attempt }}
        run: node npm/scripts/release-publication.mjs verify-accepted
      - uses: actions/upload-artifact@v4
        if: steps.verify.outputs.eligible == 'true'
        with:
          retention-days: 1
          name: publication-verified-${{ github.event.workflow_run.id || inputs.release_run }}-${{ github.event.workflow_run.run_attempt || inputs.release_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-verified.json
          if-no-files-found: error

  verify-publication-arm64:
    if: github.repository == 'risense-ai/respire-cli'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # No publication lock, OIDC, SDK credential or npm write permission. A
    # completed immutable source attempt is valid only for these read operations.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native ARM64 runner
        run: bash scripts/require-native-linux-arm64.sh aarch64-unknown-linux-gnu
      - name: Verify public package bytes and isolated exact-version installation
        id: verify
        env:
          VERIFY_ARM64: 'true'
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.release_run }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.release_attempt }}
        run: node npm/scripts/release-publication.mjs verify-accepted
      - uses: actions/upload-artifact@v4
        if: steps.verify.outputs.eligible == 'true'
        with:
          retention-days: 1
          name: publication-arm64-verified-${{ github.event.workflow_run.id || inputs.release_run }}-${{ github.event.workflow_run.run_attempt || inputs.release_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-arm64-verified.json
          if-no-files-found: error
