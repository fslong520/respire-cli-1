name: "Feature request"
description: "Propose a CLI/runtime improvement"
title: "[Feature] "
body:
  -
    type: "markdown"
    attributes:
      value: "Use English. Search existing issues first. Never post passwords, API keys/tokens, databases/backups, private memories, account identifiers or unredacted logs/screenshots.

Security vulnerabilities: do not disclose details in a public Issue or PR. Check this repository's Security tab for a private reporting option; if none is offered, ask maintainers to establish a private channel without including vulnerability details. No security email or private channel is currently documented."
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "Use case and current limitation"
      description: "Explain the concrete need and current workflow/workaround; link existing issues if relevant."
    validations:
      required: true
  -
    type: "textarea"
    id: "proposal"
    attributes:
      label: "Proposed behavior and example"
      description: "Describe expected commands/output or a minimal synthetic example; explain how to tell it works."
    validations:
      required: true
  -
    type: "textarea"
    id: "alternatives"
    attributes:
      label: "Alternatives"
      description: "What existing commands/UI or other approaches have you tried?"
    validations:
      required: false
  -
    type: "textarea"
    id: "compatibility"
    attributes:
      label: "Compatibility and impact"
      description: "If known, note JSON/MCP/API or CLI flags, stored data/index/config migration, runtime behavior, platform/performance/privacy implications. Unknown is OK."
    validations:
      required: false
