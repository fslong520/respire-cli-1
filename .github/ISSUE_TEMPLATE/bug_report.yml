name: "Bug report"
description: "CLI, runtime, installation or performance failures"
title: "[Bug] "
body:
  -
    type: "markdown"
    attributes:
      value: "Use English. Search existing issues first. Never post passwords, API keys/tokens, databases/backups, private memories, account identifiers or unredacted logs/screenshots.

Security vulnerabilities: do not disclose details in a public Issue or PR. Check this repository's Security tab for a private reporting option; if none is offered, ask maintainers to establish a private channel without including vulnerability details. No security email or private channel is currently documented."
  -
    type: "textarea"
    id: "summary"
    attributes:
      label: "Problem"
      description: "One concrete problem and its impact."
    validations:
      required: true
  -
    type: "textarea"
    id: "versions"
    attributes:
      label: "CLI and runtime versions"
      description: "Paste rsrs --version; include runtime version from sanitized rsrs doctor --json if available. For npm/pnpm launchers, include package, Node and package-manager versions; source builds include commit and Rust version. Unknown is OK if startup fails."
    validations:
      required: true
  -
    type: "textarea"
    id: "environment"
    attributes:
      label: "OS, architecture and installation"
      description: "OS/version, CPU architecture; Linux distribution and glibc/musl if known; install entry (npm/pnpm, release binary, source), shell/container/WSL if relevant."
    validations:
      required: true
  -
    type: "textarea"
    id: "reproduction"
    attributes:
      label: "Minimal commands"
      description: "Provide exact sanitized commands, flags and synthetic input/setup in an isolated profile; include direct/runtime/MCP/TUI mode, repeat rate and any prerequisites. Do not include real memory data."
    validations:
      required: true
  -
    type: "textarea"
    id: "behavior"
    attributes:
      label: "Expected and actual results"
      description: "Include expected output vs actual stdout/stderr, exit code and JSON error reason if relevant; last known working version if any."
    validations:
      required: true
  -
    type: "textarea"
    id: "context"
    attributes:
      label: "Performance context (if relevant)"
      description: "Memory/CPU peaks and measurement method; dataset count/size using synthetic data; model/engine/accelerator; foreground commands, background download/index state, concurrency/request rate, elapsed time, cold/warm cache. Include sanitized doctor diagnostics only if safe."
    validations:
      required: false
  -
    type: "textarea"
    id: "evidence"
    attributes:
      label: "Sanitized diagnostics"
      description: "Optional small logs, test/benchmark evidence and related issue links. Remove paths with usernames, URLs with credentials, tokens and memory contents; do not attach a database."
    validations:
      required: false
