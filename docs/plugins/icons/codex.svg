<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 1. Warm paper-white base: parchment-tinted light, same lineage as the dark build, no cold grey -->
    <linearGradient id="bg-paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>

    <!-- 2. Warm-red breathing bloom where the curves meet (more restrained on light, starting at 6%) -->
    <radialGradient id="crimson-breath" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#A93021" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#A93021" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#A93021" stop-opacity="0" />
    </radialGradient>

    <!-- 3. Main-line optical gradient (reversed to warm ink black on light, slightly recessed at both ends) -->
    <linearGradient id="stroke-ink" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#211E19" stop-opacity="0.30" />
      <stop offset="15%" stop-color="#211E19" stop-opacity="0.92" />
      <stop offset="85%" stop-color="#211E19" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#211E19" stop-opacity="0.40" />
    </linearGradient>

    <!-- 4. Secondary-line rust-red gradient (same as the dark build, plenty of contrast on light) -->
    <linearGradient id="stroke-rust" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A93021" stop-opacity="0.4" />
      <stop offset="18%" stop-color="#A93021" stop-opacity="1" />
      <stop offset="52%" stop-color="#D14332" stop-opacity="1" />
      <stop offset="85%" stop-color="#A93021" stop-opacity="1" />
      <stop offset="100%" stop-color="#A93021" stop-opacity="0.45" />
    </linearGradient>

    <!-- 5. Chip face: a warm-white card floating slightly above -->
    <linearGradient id="chip-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#F6F2E9" />
    </linearGradient>

    <!-- 6. Light-background shadow: thin and soft, no grey smear -->
    <filter id="line-lift" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3A332A" flood-opacity="0.22" />
    </filter>

    <!-- 7. AI spark (four-point star) local coordinates: tip 26 / waist 9, easy to reuse and scale -->
    <path id="spark" d="M0 -26 Q4 -6 24 0 Q4 6 0 26 Q-4 6 -24 0 Q-4 -6 0 -26 Z" />
  </defs>

  <!-- Rounded icon base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-paper)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#crimson-breath)" />

  <!-- 1px hairline inner border; a low-opacity warm ink defines the edge on light -->
  <rect x="24.75" y="24.75" width="462.5" height="462.5" rx="107.25" fill="none" stroke="#211E19" stroke-opacity="0.10" stroke-width="1.5" />

  <!-- Memory layer: two offset outlines behind the chip body (memory = stored layer by layer) -->
  <g fill="none" stroke="url(#stroke-rust)" stroke-width="4" stroke-linejoin="round">
    <rect x="110" y="134" width="320" height="272" rx="48" stroke-opacity="0.35" />
    <rect x="124" y="148" width="320" height="272" rx="48" stroke-opacity="0.18" />
  </g>

  <!-- AI chip body: a warm-white card carries the breathing curves, with a warm-red bloom on top -->
  <rect x="96" y="120" width="320" height="272" rx="48" fill="url(#chip-face)" />
  <rect x="96" y="120" width="320" height="272" rx="48" fill="url(#crimson-breath)" />
  <rect x="96" y="120" width="320" height="272" rx="48" fill="none" stroke="url(#stroke-ink)" stroke-width="5" />

  <!-- Chip pins: 3 top, 3 bottom, 3 left, 3 right, rounded -->
  <g stroke="#211E19" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round">
    <path d="M176 120V96 M256 120V96 M336 120V96" />
    <path d="M176 392v24 M256 392v24 M336 392v24" />
    <path d="M96 184H72 M96 256H72 M96 328H72" />
    <path d="M416 184h24 M416 256h24 M416 328h24" />
  </g>

  <!-- Core graphic: the native viewBox (0 0 52 44) mapped proportionally and centred; both ends leave the chip = signal lines for memory in and out -->
  <g transform="translate(68.8, 97.6) scale(7.2)" filter="url(#line-lift)">
    <!-- Secondary line (Exhale / Remember): native #a93021 path -->
    <path d="M3 25C9 14 13 10 19 14s11 24 20 20c5-2 7-6 10-9" fill="none" stroke="url(#stroke-rust)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Main line (Inhale / Recall): reversed to warm ink black on light -->
    <path d="M3 23C10 22 9 6 18 7S32 40 41 36c4-2 6-8 8-12" fill="none" stroke="url(#stroke-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Memory entries: three archive bars bottom-left inside the card (decreasing width = records stored one by one) -->
  <g fill="#211E19">
    <rect x="132" y="318" width="68" height="10" rx="5" fill-opacity="0.55" />
    <rect x="132" y="336" width="52" height="10" rx="5" fill-opacity="0.38" />
    <rect x="132" y="354" width="36" height="10" rx="5" fill-opacity="0.22" />
  </g>

  <!-- AI sparks: a main spark top-right (rust red) plus a small spark top left (warm ink), signalling artificial intelligence -->
  <use href="#spark" x="370" y="164" fill="url(#stroke-rust)" />
  <use href="#spark" transform="translate(142 170) scale(0.5)" fill="#211E19" fill-opacity="0.68" />
</svg>
