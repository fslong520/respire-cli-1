[package]
name = "respire_spawn"
version = "1.0.10"
edition = "2021"
rust-version = "1.88"
description = "Start the respire runtime without inheriting the caller's pipes"
license-file = "../LICENSE"
publish = false

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Wdk_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
